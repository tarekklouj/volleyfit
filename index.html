<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VolleyFit</title>
  <meta name="description" content="Programme de salle Basic-Fit pour joueur de volleyball, avec suivi des charges, des records et de la composition corporelle.">
  <meta name="theme-color" content="#E8431A">
  <script>
    try { var t = (JSON.parse(localStorage.getItem('volleyfit-v2') || '{}').profile || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if ((JSON.parse(localStorage.getItem('volleyfit-v2') || '{}').profile || {}).lang === 'en') document.documentElement.lang = 'en'; } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=41">
</head>
<body>
  <svg class="fig-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="vfSkin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--fig-hi)"/><stop offset=".55" style="stop-color:var(--fig-body)"/><stop offset="1" style="stop-color:var(--fig-shade)"/></linearGradient>
    <linearGradient id="vfSkinFar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--fig-far-hi)"/><stop offset="1" style="stop-color:var(--fig-far-shade)"/></linearGradient>
    <linearGradient id="vfMus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--fig-mus-hi)"/><stop offset=".6" style="stop-color:var(--fig-mus)"/><stop offset="1" style="stop-color:var(--fig-mus-shade)"/></linearGradient>
    <linearGradient id="vfP" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mus-p-hi)"/><stop offset=".55" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--mus-p-shade)"/></linearGradient>
    <linearGradient id="vfS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mus-s-hi)"/><stop offset="1" style="stop-color:var(--accent-soft)"/></linearGradient>
  </defs></svg>
  <button id="resume" class="resume" type="button" hidden><span></span><b>Reprendre</b></button>

  <main class="app">
    <section id="view-today" class="view" aria-label="Séance du jour"></section>
    <section id="view-program" class="view" aria-label="Entraînement" hidden></section>
    <section id="view-muscles" class="view" aria-label="Muscles" hidden></section>
    <section id="view-nutrition" class="view" aria-label="Nutrition" hidden></section>
    <section id="view-progress" class="view" aria-label="Progrès" hidden></section>
    <section id="view-profile" class="view" aria-label="Profil" hidden></section>
  </main>

  <div id="timer" class="timer" hidden role="timer" aria-live="polite">
    <div class="timer__track"><span id="timer-progress"></span></div>
    <div class="timer__row">
      <div class="timer__info">
        <p id="timer-label" class="timer__label"></p>
        <p id="timer-time" class="timer__time">0:00</p>
      </div>
      <button id="timer-minus" class="timer__btn" type="button" aria-label="Moins 15 secondes">−15</button>
      <button id="timer-plus" class="timer__btn" type="button" aria-label="Plus 15 secondes">+15</button>
      <button id="timer-ios" class="timer__btn" type="button" aria-label="Minuteur iPhone" hidden>⏱</button>
      <button id="timer-skip" class="timer__btn timer__btn--skip" type="button">Passer</button>
    </div>
  </div>

  <nav class="tabs" aria-label="Navigation">
    <button class="tab" data-view="today" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3 3 15 0 18M3.5 9c4 1.5 13 1.5 17 0M5 17c3-3 11-3 14 0"/></svg>Séance
    </button>
    <button class="tab" data-view="program" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Plan
    </button>
    <button class="tab" data-view="muscles" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2.5"/><path d="M6 9.5c2 1 4 1.3 6 1.3s4-.3 6-1.3M12 11v5M9 21l3-5 3 5M8.5 13.5l-1 3M15.5 13.5l1 3"/></svg>Muscles
    </button>
    <button class="tab" data-view="nutrition" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-1.5-2-5-2.2-6.5.3C4 10 5 15 7.5 18.5c1.2 1.7 2.8 2.3 4.5 1.3 1.7 1 3.3.4 4.5-1.3C19 15 20 10 18.5 7.3 17 4.8 13.5 5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>Nutrition
    </button>
    <button class="tab" data-view="progress" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progrès
    </button>
    <button class="tab" data-view="profile" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/data.js?v=41"></script>
  <script src="js/figures.js?v=41"></script>
  <script src="js/i18n.js?v=41"></script>
  <script src="js/app.js?v=41"></script>
</body>
</html>
